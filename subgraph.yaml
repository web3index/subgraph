specVersion: 0.0.4
description: The Web3 Index reports on the demand-side fees paid into web3
  network protocols.
repository: https://github.com/web3index/subgraph
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: livepeer
    network: matic
    source:
      abi: TicketBroker
      address: "0x0000000000000000000000000000000000000000"
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/livepeer/mapping.ts
      abis:
        - name: TicketBroker
          file: ./src/livepeer/abis/TicketBroker.json
        - name: UniswapExchange
          file: ./src/livepeer/abis/UniswapExchange.json
        - name: UniswapV3Pool
          file: ./src/livepeer/abis/UniswapV3Pool.json
        - name: AggregatorV3Interface
          file: ./src/livepeer/abis/AggregatorV3Interface.json
      entities:
        - Day
        - Protocol
      eventHandlers:
        - event: WinningTicketRedeemed(indexed address,indexed
            address,uint256,uint256,uint256,uint256,bytes)
          handler: winningTicketRedeemed
  - kind: ethereum/contract
    name: thegraphBilling
    network: matic
    source:
      abi: Billing
      address: "0x10829DB618E6F520Fa3A01c75bC6dDf8722fA9fE"
      startBlock: 17803962
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.6
      language: wasm/assemblyscript
      file: ./src/thegraph/mapping.ts
      entities:
        - TokensPulled
      abis:
        - name: Billing
          file: ./src/thegraph/abis/Billing.json
        - name: SushiPair
          file: ./src/thegraph/abis/SushiPair.json
      eventHandlers:
        - event: TokensPulled(indexed address,uint256)
          handler: handleTokensPulled
